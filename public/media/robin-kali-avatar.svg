<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="50%" stop-color="#04060e" />
      <stop offset="100%" stop-color="#020308" />
    </linearGradient>

    <!-- Cyan to Purple Neon Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Cosmic Radial Glows -->
    <radialGradient id="cyanGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020308" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#020308" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow filter -->
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="6" stdDeviation="20" flood-color="#a855f7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="600" height="900" rx="32" fill="url(#bg)" />
  <rect width="600" height="900" rx="32" fill="url(#cyanGlow)" />
  <rect width="600" height="900" rx="32" fill="url(#purpleGlow)" />

  <!-- Smooth Rounded Neon Outer Border -->
  <rect x="24" y="24" width="552" height="852" rx="26" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="32" y="32" width="536" height="836" rx="22" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Top Pill Badge -->
  <g transform="translate(300, 85)">
    <rect x="-115" y="-16" width="230" height="32" rx="16" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1" />
    <circle cx="-85" cy="0" r="3.5" fill="#00f2fe" filter="url(#neonShadow)" />
    <text x="5" y="4" text-anchor="middle" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3">PORTFOLIO &#8226; DOSSIER</text>
  </g>

  <!-- Central Constellation / Glowing Orbital Monogram -->
  <g transform="translate(300, 340)">
    <!-- Outer concentric orbital rings -->
    <circle r="150" fill="none" stroke="rgba(168, 85, 247, 0.15)" stroke-width="1" />
    <circle r="125" fill="none" stroke="rgba(0, 242, 254, 0.25)" stroke-dasharray="6,8" stroke-width="1.2" />
    <circle r="95" fill="none" stroke="rgba(192, 132, 252, 0.28)" stroke-width="1" />
    <circle r="72" fill="none" stroke="rgba(0, 242, 254, 0.45)" stroke-dasharray="3,5" stroke-width="1" />

    <!-- Center Core glowing orb -->
    <circle r="54" fill="url(#neonGrad)" filter="url(#neonShadow)" />
    <circle r="50" fill="#070c18" />

    <!-- Monogram 'RK' -->
    <text x="0" y="15" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="42" letter-spacing="3">RK</text>

    <!-- Glowing Orbiting Nodes -->
    <circle cx="0" cy="-125" r="5" fill="#00f2fe" filter="url(#neonShadow)" />
    <circle cx="125" cy="0" r="4" fill="#c084fc" filter="url(#neonShadow)" />
    <circle cx="-88" cy="88" r="4" fill="#38bdf8" />
    <circle cx="88" cy="-88" r="3.5" fill="#a855f7" />
    <circle cx="-67" cy="-67" r="3" fill="#ffffff" />
  </g>

  <!-- Typography: Name & Title -->
  <text x="300" y="575" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="3">ROBIN KALI</text>
  
  <!-- Subtle Gradient Accent Line -->
  <rect x="220" y="596" width="160" height="2" rx="1" fill="url(#neonGrad)" />

  <text x="300" y="632" text-anchor="middle" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="4">DEVELOPER &#8226; CREATOR</text>

  <!-- Subtitle Tags -->
  <text x="300" y="690" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" letter-spacing="2">WEB &#8226; 3D &#8226; INTERACTIVE</text>

  <!-- Bottom CTA Pill -->
  <g transform="translate(300, 770)">
    <rect x="-110" y="-22" width="220" height="44" rx="22" fill="rgba(168, 85, 247, 0.15)" stroke="url(#neonGrad)" stroke-width="1.2" />
    <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">EXPLORE DOSSIER</text>
  </g>
</svg>
