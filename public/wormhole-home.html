        body {

        #stage-container {

        /* Hide upstream FPS counter and duplicate share container */

        .stats.active,

        .icon-mail:before {

        .icon-globe:before {

        }

            border-color: rgba(0, 242, 254, 0.45) !important;

<body>

    <div class="loader active"></div>

    <div class="share center animated zoomInUp" style="display: none">

        <a class="btn icon-linkedin icon-trim" href="https://www.linkedin.com/in/robin-kalaykhan-4b2443153/" target="_top" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn"><span>LinkedIn</span></a> &nbsp;

    </div>

    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r75/three.min.js"></script>
    <script defer src="/vendor/wormhole-extreme/dist/js/polyfills.js"></script>
    <script defer src="/vendor/wormhole-extreme/dist/js/bundle.min.js"></script>
    <script defer src="/vendor/wormhole-extreme/dist/js/app.js"></script>
    <script>
      (function() {
        function initSecure() {
          var links = document.querySelectorAll('a[data-secure-contact]');
          links.forEach(function(el) {
            function unlock() {
              var enc = el.getAttribute('data-secure-contact');
              if (enc && !el.dataset.unlocked) {
                el.dataset.unlocked = 'true';
                try { el.href = atob(enc); } catch(e) {}
              }
            }
            el.addEventListener('pointerenter', unlock);
            el.addEventListener('focus', unlock);
            el.addEventListener('touchstart', unlock);
            el.addEventListener('mousedown', unlock);
            el.addEventListener('click', function(e) {
              unlock();
              var h = el.getAttribute('href');
              if (h && h !== '#') {
                if (el.getAttribute('target') === '_top') {
                  top.location.href = h;
                  e.preventDefault();
                } else if (el.getAttribute('target') === '_blank') {
                  window.open(h, '_blank', 'noopener,noreferrer');
                  e.preventDefault();
                }
              }
            });
          });
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initSecure);
        } else {
          initSecure();
        }
      })();
    </script>

</body>
