<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="32" fill="#050814" />
  <circle cx="64" cy="64" r="60" fill="url(#glow)" />

  <!-- Glowing orbital ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#neon)" stroke-width="3" stroke-opacity="0.9" />
  <circle cx="64" cy="64" r="56" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,6" />

  <!-- Orbit nodes -->
  <circle cx="64" cy="14" r="4" fill="#00f2fe" />
  <circle cx="114" cy="64" r="3.5" fill="#a855f7" />

  <!-- Monogram RK -->
  <text x="64" y="78" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="1">RK</text>
</svg>
